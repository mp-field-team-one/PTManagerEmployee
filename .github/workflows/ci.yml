name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - run: ./gradlew testDebugUnitTest

  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed credentials
        run: |
          if git ls-files | grep -E '(^|/)(google-services\.json|.*\.(jks|keystore))$'; then
            echo "Credentials and signing keys must not be committed."
            exit 1
          fi
